<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150">
  <defs>
    <linearGradient id="gF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818CF8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="glow" x="-40%" y="-100%" width="180%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="600" cy="66" r="110" fill="url(#halo)"/>

  <circle cx="600" cy="55" r="29" fill="#0D1524" stroke="url(#gF)" stroke-width="2"/>
  <circle cx="600" cy="55" r="29" fill="none" stroke="url(#gF)" stroke-width="8" opacity="0.18" filter="url(#soft)"/>
  <text x="600" y="67" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" fill="url(#gF)" filter="url(#glow)">M</text>

  <text x="600" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" letter-spacing="7" fill="#EAF1FB">MOBIN HASANGHASEMI</text>
  <text x="600" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" letter-spacing="4.5" fill="#5D6E87">PYTHON · DJANGO · BACKEND ENGINEERING</text>
</svg>