      <stop offset="0" stop-color="#F5F8FE"/>
      <stop offset="1" stop-color="#9FB0C7"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A855F7"/>
