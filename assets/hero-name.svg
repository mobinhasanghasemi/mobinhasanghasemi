  <text x="600" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="2" fill="url(#ng)" filter="url(#glow)">Mobin Hasanghasemi</text>

  <text x="600" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="13" fill="url(#tg)">MID LEVEL BACKEND DEVELOPER</text>

