  <text x="600" y="102" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="84" font-weight="700" letter-spacing="2" fill="url(#ng)" filter="url(#glow)">Mobin Hasanghasemi</text>
  <text x="600" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="12" fill="url(#tg)">MID LEVEL BACKEND DEVELOPER</text>
  <line x1="470" y1="186" x2="730" y2="186" stroke="url(#tg)" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
