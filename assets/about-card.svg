<svg xmlns="http://www.w3.org/2000/svg" width="620" height="668" viewBox="0 0 620 668">
  <defs>
    <linearGradient id="gEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="gT" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowTL" cx="0" cy="0" r="0.8">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.13"/>
      <stop offset="0.55" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBR" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#A855F7" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#1D4ED8" flood-opacity="0.28"/>
    </filter>
