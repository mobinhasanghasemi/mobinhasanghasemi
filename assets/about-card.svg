  <rect x="4" y="4" width="612" height="660" rx="26" fill="none" stroke="url(#gEdge)" stroke-width="1.5" opacity="0.65"/>

  <text x="36" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#22D3EE">// PROFILE SUMMARY</text>
  <rect x="36" y="62" width="548" height="1" fill="url(#gT)" opacity="0.35"/>

  <text x="36" y="96" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">Backend developer focused on building clean,</text>
  <text x="36" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">scalable and maintainable systems.</text>

  <text x="36" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">I work mainly with Python and Django ecosystem,</text>
  <text x="36" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">designing REST APIs, database structures</text>
  <text x="36" y="214" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">and reliable backend architectures.</text>

  <text x="36" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">I enjoy learning software architecture,</text>
  <text x="36" y="276" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">improving performance, writing clean code</text>
  <text x="36" y="304" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B4C1D4">and solving real-world problems.</text>

  <rect x="36" y="344" width="548" height="1" fill="url(#gT)" opacity="0.35"/>

  <text x="36" y="372" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="3.5" fill="#8B9BB3">DEVELOPER IDENTITY</text>

