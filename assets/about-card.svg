  <text x="38" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="4" fill="#22D3EE">PROFILE SUMMARY</text>
  <rect x="36" y="62" width="548" height="1" fill="url(#gT)" opacity="0.35"/>

  <text x="36" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">Backend developer focused on building clean,</text>
  <text x="36" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">scalable and maintainable systems.</text>

  <text x="36" y="160" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">I work mainly with Python and Django ecosystem,</text>
  <text x="36" y="188" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">designing REST APIs, database structures</text>
  <text x="36" y="216" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">and reliable backend architectures.</text>

  <text x="36" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">I enjoy learning software architecture,</text>
  <text x="36" y="278" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">improving performance, writing clean code</text>
  <text x="36" y="306" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#B7C5D8">and solving real-world problems.</text>

  <rect x="36" y="344" width="548" height="1" fill="url(#gT)" opacity="0.35"/>

