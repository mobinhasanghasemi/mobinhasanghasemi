    <text x="92" y="278" font-size="17" font-weight="700" fill="#EDF3FC">System Architecture</text>
    <text x="92" y="306" font-size="13.5" fill="#94A5BC">Modular design, layering and</text>
    <text x="92" y="328" font-size="13.5" fill="#94A5BC">separation of concerns.</text>

