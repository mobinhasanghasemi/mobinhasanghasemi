<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="gV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0 H0 V48" fill="none" stroke="rgba(56,189,248,0.05)"/>
    </pattern>
    <filter id="glow" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="20" y="0" width="1160" height="360" rx="24" fill="#0D1524" stroke="rgba(56,189,248,0.30)"/>
  <rect x="22" y="2" width="1156" height="356" rx="22" fill="url(#grid)"/>
  <path d="M20 96 V56 A36 36 0 0 1 56 20 H118" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.55"/>
  <path d="M1180 264 V304 A36 36 0 0 1 1144 340 H1082" fill="none" stroke="#A855F7" stroke-width="2" opacity="0.55"/>

  <circle cx="56" cy="44" r="6" fill="#FF5F57"/>
  <circle cx="80" cy="44" r="6" fill="#FEBC2E"/>
  <circle cx="104" cy="44" r="6" fill="#28C840"/>
  <text x="600" y="50" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#7E8EA6">vision.sh</text>
  <text x="1140" y="50" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="4" fill="#22D3EE">// DIRECTION</text>

  <text x="52" y="156" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#22D3EE">&gt;</text>
  <text x="100" y="156" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="url(#gV)" filter="url(#glow)">building scalable software.</text>

  <text x="52" y="212" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#22D3EE">&gt;</text>
  <text x="100" y="212" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="url(#gV)" filter="url(#glow)">learning architecture.</text>

  <text x="52" y="268" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="#22D3EE">&gt;</text>
  <text x="100" y="268" font-family="Consolas, Menlo, monospace" font-size="30" font-weight="700" fill="url(#gV)" filter="url(#glow)">creating useful products.</text>
  <rect x="712" y="236" width="17" height="32" rx="2" fill="#38BDF8">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="52" y="330" font-family="Consolas, Menlo, monospace" font-size="12.5" fill="#56657C">// build · learn · ship</text>
  <text x="1148" y="330" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="4" fill="#3C4E66">SCALABILITY — ARCHITECTURE — PRODUCT</text>
</svg>